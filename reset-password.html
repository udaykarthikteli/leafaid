<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — Leaf Aid</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B3D2E">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
<script>(function(){try{if(localStorage.getItem('leafaid-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
</head>
<body>

<div class="auth-page">
  <div class="auth-form-side">
    <a href="login.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to login
    </a>
    <button class="theme-toggle-btn" data-theme-toggle aria-label="Toggle dark mode"></button>

    <a href="index.html" class="auth-brand">
      <img src="assets/logo.svg" class="logo-mark" alt="Leaf Aid logo">
      <span>Leaf Aid</span>
    </a>

    <h1>Set a new password.</h1>
    <p class="sub">Choose something you haven't used before.</p>

    <form id="resetForm">
      <div class="form-row">
        <label for="newPassword">New password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="newPassword" type="password" placeholder="New password" required>
          <button type="button" class="toggle-eye" aria-label="Show password">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="form-row">
        <label for="confirmPassword">Confirm new password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="confirmPassword" type="password" placeholder="Confirm password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">
        Update password
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </div>

  <div class="auth-art-side">
    <div class="auth-art-leaf"><img src="assets/leaf-base.svg" alt=""></div>
    <div class="auth-art-top"><span class="auth-badge">◎ Secure account recovery</span></div>
    <div class="auth-art-bottom">
      <h2>Almost there.</h2>
      <p>Once your password's updated, you'll be signed straight back into your dashboard.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/script.js"></script>
<script src="assets/auth.js"></script>
</body>
</html>
